name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  checks:
    # shellcheck, tests on Linux + macOS, scanners (reports uploaded as the scanner-reports artifact)
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Tag must match the installer version
        run: |
          want="nawala-agent-setup ${GITHUB_REF_NAME#v}"
          got="$(bash install.sh --version)"
          [ "$got" = "$want" ] || { echo "::error::tag $GITHUB_REF_NAME but install.sh says '$got'"; exit 1; }
          grep -q "^NAWALA_HOOK_VERSION=\"${GITHUB_REF_NAME#v}\"" hook.sh || { echo "::error::hook.sh version differs"; exit 1; }
      - name: Build release assets (reproducible tarball on GNU tar)
        run: scripts/build-release.sh "$PWD/dist"
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # create the GitHub Release
      id-token: write   # Sigstore keyless signing (GitHub OIDC); only this job gets it
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: scanner-reports
          path: dist/reports
      - uses: sigstore/cosign-installer@v4.1.3
      - name: Verify checksums, then sign every asset (keyless)
        working-directory: dist
        run: |
          sha256sum -c SHA256SUMS
          for f in install.sh hook.sh templates.tar.gz SHA256SUMS; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
          tar -czf scanner-reports.tar.gz -C reports .
      - name: Verify a signature the way users will
        working-directory: dist
        run: |
          cosign verify-blob --bundle install.sh.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com install.sh
      - name: Publish the GitHub Release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha="$(sha256sum install.sh | cut -d' ' -f1)"
          {
            echo "## Install"
            echo
            echo "Paste the prompt for your agent from [PROMPTS.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/PROMPTS.md) with:"
            echo
            echo "- \`{{VERSION}}\` = \`${GITHUB_REF_NAME}\`"
            echo "- \`{{SHA256}}\` = \`${sha}\` (sha256 of install.sh)"
            echo
            echo "Verify before installing: see [SECURITY.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/SECURITY.md#how-to-verify-before-installing)."
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag \
            install.sh hook.sh templates.tar.gz SHA256SUMS \
            install.sh.sigstore.json hook.sh.sigstore.json templates.tar.gz.sigstore.json SHA256SUMS.sigstore.json \
            scanner-reports.tar.gz
