name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to 26.04 (newer shellcheck)
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck (preinstalled on the runner)
        run: |
          shellcheck --version
          shellcheck install.sh hook.sh scripts/*.sh tests/run.sh tests/lib.sh tests/*.test.sh tests/bin/curl

  test:
    timeout-minutes: 15 # a stuck runner fails fast instead of hanging for hours
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Tool versions
        run: bash --version | head -n 1; jq --version; curl --version | head -n 1
      - name: Tests (source tree)
        run: tests/run.sh
      - name: Build release assets
        run: scripts/build-release.sh "$PWD/dist"
      - name: Tests (built release install.sh)
        run: NAWALA_INSTALL_SH="$PWD/dist/install.sh" tests/run.sh install
      - name: ShellCheck the built install.sh
        if: runner.os == 'Linux'
        run: shellcheck dist/install.sh

  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Assemble the scan target (exactly what an agent receives)
        run: |
          mkdir -p build/skills/nawala-setup reports
          cp skill/nawala-setup/SKILL.md install.sh hook.sh build/skills/nawala-setup/
          cp -R templates build/skills/nawala-setup/templates
          cp PROMPTS.md build/skills/nawala-setup/PROMPTS.md

      - name: Semgrep (r/bash + p/secrets; blocking)
        run: |
          python -m pip install --quiet semgrep==1.185.0
          semgrep scan --config r/bash --config p/secrets --metrics=off --error \
            --sarif --sarif-output=reports/semgrep.sarif \
            install.sh hook.sh scripts tests templates skill

      - name: Cisco AI Defense skill-scanner (static analyzers, no API key; report only)
        run: |
          python -m pip install --quiet cisco-ai-skill-scanner==2.3.2
          rc=0
          skill-scanner scan-all build/skills --recursive --lenient \
            --format sarif --format markdown \
            --output-sarif reports/cisco-skill-scanner.sarif \
            --output-markdown reports/cisco-skill-scanner.md || rc=$?
          echo "skill-scanner exit code: $rc"
          cat reports/cisco-skill-scanner.md || true

      - name: NVIDIA SkillSpector (static, --no-llm, no API key; report only)
        run: |
          python -m pip install --quiet uv
          uv tool install "git+https://github.com/NVIDIA/skillspector.git@v2.13.5"
          rc=0
          skillspector scan build/skills/nawala-setup --no-llm --format sarif --output reports/skillspector.sarif || rc=$?
          skillspector scan build/skills/nawala-setup --no-llm --format markdown --output reports/skillspector.md || true
          echo "skillspector exit code: $rc (0: risk <= 50, 1: risk > 50, 2: error). Expected findings are explained in SECURITY.md."
          head -n 40 reports/skillspector.md || true

      - name: Upload scanner reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scanner-reports
          path: reports/
          if-no-files-found: warn
